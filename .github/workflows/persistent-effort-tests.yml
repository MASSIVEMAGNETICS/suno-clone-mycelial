name: persistent-effort-tests

on:
  pull_request:
    paths:
      - 'persistent_effort/**'
      - '.github/workflows/persistent-effort-tests.yml'
  push:
    branches:
      - feature/persistent-reference-adaptation
    paths:
      - 'persistent_effort/**'
      - '.github/workflows/persistent-effort-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q persistent_effort
      - name: Unit tests
        run: python -m unittest discover -s persistent_effort/tests -v
      - name: CLI smoke test
        run: python -m persistent_effort.engine --help
